name: Weekly KPI Report

on:
  schedule:
    - cron: "0 1 * * 1" # Every Monday at 01:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "7"

jobs:
  kpi-report:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare SSH key
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Generate KPI report on production server
        env:
          KPI_DAYS: ${{ github.event.inputs.days || '7' }}
        run: |
          set -e
          ssh -i ~/.ssh/id_rsa "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "cd /root/itzuun && docker compose -f docker-compose.prod.yml run --rm api python manage.py weekly_kpi_report --days ${KPI_DAYS} --json" \
            > kpi_report.json

      - name: Generate pilot readiness report on production server
        run: |
          set -e
          cat > /tmp/pilot_readiness_remote.sh <<'SH'
          set -e
          cd /root/itzuun
          if docker compose -f docker-compose.prod.yml run --rm api python manage.py help | grep -q "pilot_readiness_report"; then
            docker compose -f docker-compose.prod.yml run --rm api \
              python manage.py pilot_readiness_report --json \
              --cohort-validation /root/itzuun/docs/evidence/pilot_cohort_validation.json
          else
            python - <<'PY'
          import json
          print(json.dumps({
            "phase": "Launch Readiness",
            "summary": {
              "projects_posted_total": 0,
              "escrow_funded_total": 0,
              "completed_total": 0,
              "resolved_dispute_total": 0,
              "cohort_validation_path": "/root/itzuun/docs/evidence/pilot_cohort_validation.json",
              "cohort_missing_total": 999999
            },
            "gates": {
              "projects_posted_20": False,
              "escrow_activity_non_zero": False,
              "completed_projects_non_zero": False,
              "dispute_resolved_non_zero": False,
              "cohort_validated_no_missing": False
            },
            "ready": False,
            "missing_gates": ["command_unavailable_on_server"]
          }, indent=2))
          PY
          fi
          SH
          ssh -i ~/.ssh/id_rsa "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" 'bash -s' \
            < /tmp/pilot_readiness_remote.sh > pilot_readiness_report.json

      - name: Validate JSON report and required KPI keys
        run: |
          set -e
          python - <<'PY'
          import json
          import sys

          REQUIRED_TOP_LEVEL = {"window_days", "since", "kpis"}
          REQUIRED_KPI_KEYS = [
              "projects_posted",
              "hired_projects",
              "proposal_to_hire_conversion_pct",
              "escrow_funded_count",
              "completion_rate_pct",
              "dispute_rate_pct",
              "avg_rating",
              "new_freelancer_signups",
              "verified_freelancers",
          ]

          with open('kpi_report.json', 'r', encoding='utf-8') as f:
              payload = json.load(f)

          missing_top = sorted(REQUIRED_TOP_LEVEL - set(payload.keys()))
          if missing_top:
              print("KPI JSON top-level keys are missing.", file=sys.stderr)
              print(f"Found top-level keys: {sorted(payload.keys())}", file=sys.stderr)
              print(f"Missing top-level keys: {missing_top}", file=sys.stderr)
              sys.exit(1)

          if not isinstance(payload["kpis"], dict):
              print("KPI JSON field 'kpis' must be an object.", file=sys.stderr)
              print(f"Actual type: {type(payload['kpis']).__name__}", file=sys.stderr)
              sys.exit(1)

          found_kpi_keys = sorted(payload["kpis"].keys())
          missing_kpi = [key for key in REQUIRED_KPI_KEYS if key not in payload["kpis"]]
          if missing_kpi:
              print("KPI JSON is missing required KPI keys.", file=sys.stderr)
              print(f"Found KPI keys: {found_kpi_keys}", file=sys.stderr)
              print(f"Missing KPI keys: {missing_kpi}", file=sys.stderr)
              sys.exit(1)

          print("KPI JSON validation passed.")
          print(f"Found KPI keys: {found_kpi_keys}")
          PY

      - name: Upload KPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-kpi-report
          path: kpi_report.json

      - name: Validate pilot readiness JSON schema
        run: |
          set -e
          python - <<'PY'
          import json
          import sys

          REQUIRED_TOP_LEVEL = {"phase", "summary", "gates", "ready", "missing_gates"}

          with open('pilot_readiness_report.json', 'r', encoding='utf-8') as f:
              payload = json.load(f)

          missing_top = sorted(REQUIRED_TOP_LEVEL - set(payload.keys()))
          if missing_top:
              print("Pilot readiness JSON top-level keys are missing.", file=sys.stderr)
              print(f"Found keys: {sorted(payload.keys())}", file=sys.stderr)
              print(f"Missing keys: {missing_top}", file=sys.stderr)
              sys.exit(1)

          if not isinstance(payload["gates"], dict):
              print("Pilot readiness field 'gates' must be an object.", file=sys.stderr)
              sys.exit(1)
          if not isinstance(payload["missing_gates"], list):
              print("Pilot readiness field 'missing_gates' must be an array.", file=sys.stderr)
              sys.exit(1)
          if not isinstance(payload["ready"], bool):
              print("Pilot readiness field 'ready' must be boolean.", file=sys.stderr)
              sys.exit(1)

          print("Pilot readiness JSON validation passed.")
          PY

      - name: Upload pilot readiness artifact
        uses: actions/upload-artifact@v4
        with:
          name: pilot-readiness-report
          path: pilot_readiness_report.json

      - name: Print KPI summary
        run: |
          set -e
          python - <<'PY'
          import json

          with open('kpi_report.json', 'r', encoding='utf-8') as f:
              payload = json.load(f)

          print(f"Window days: {payload['window_days']}")
          print(f"Since: {payload['since']}")
          for k, v in payload['kpis'].items():
              print(f"- {k}: {v}")
          PY

      - name: Print pilot readiness summary
        run: |
          set -e
          python - <<'PY'
          import json

          with open('pilot_readiness_report.json', 'r', encoding='utf-8') as f:
              payload = json.load(f)

          print(f"Pilot ready: {payload['ready']}")
          print(f"Missing gates: {payload['missing_gates']}")
          for k, v in payload["summary"].items():
              print(f"- {k}: {v}")
          PY

      - name: Notify Slack (optional)
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        run: |
          set -e
          python - <<'PY'
          import json
          import os
          import urllib.request

          with open('kpi_report.json', 'r', encoding='utf-8') as f:
              payload = json.load(f)
          with open('pilot_readiness_report.json', 'r', encoding='utf-8') as f:
              readiness = json.load(f)

          k = payload['kpis']
          text = (
              f"ITZuun Weekly KPI ({payload['window_days']}d)\n"
              f"projects_posted={k['projects_posted']}, hired_projects={k['hired_projects']}, "
              f"proposal_to_hire_conversion_pct={k['proposal_to_hire_conversion_pct']}\n"
              f"escrow_funded_count={k['escrow_funded_count']}, completion_rate_pct={k['completion_rate_pct']}, "
              f"dispute_rate_pct={k['dispute_rate_pct']}\n"
              f"avg_rating={k['avg_rating']}, new_freelancer_signups={k['new_freelancer_signups']}, "
              f"verified_freelancers={k['verified_freelancers']}\n"
              f"pilot_ready={readiness['ready']}"
          )

          req = urllib.request.Request(
              url=os.environ['SLACK_WEBHOOK_URL'],
              data=json.dumps({'text': text}).encode('utf-8'),
              headers={'Content-Type': 'application/json'},
              method='POST',
          )

          with urllib.request.urlopen(req) as resp:
              if resp.status >= 300:
                  raise RuntimeError(f"Slack webhook failed: {resp.status}")
          PY

      - name: Notify Slack on failure (optional)
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          set -e
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["REPO"]
          run_id = os.environ["RUN_ID"]
          workflow = os.environ["WORKFLOW"]
          run_url = f"https://github.com/{repo}/actions/runs/{run_id}"

          text = (
              f"KPI workflow failed: {workflow}\n"
              f"Repository: {repo}\n"
              f"Run: {run_url}"
          )

          req = urllib.request.Request(
              url=os.environ["SLACK_WEBHOOK_URL"],
              data=json.dumps({"text": text}).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(req) as resp:
              if resp.status >= 300:
                  raise RuntimeError(f"Slack webhook failed: {resp.status}")
          PY
