name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-quality-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: itzuun_user
          POSTGRES_PASSWORD: itzuun_pass
          POSTGRES_DB: itzuun
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 isort pytest pytest-django psycopg[binary]

      - name: Formatting check (Black)
        run: |
          cd backend
          black --check . || echo "Black found issues"

      - name: Django System Checks
        env:
          DJANGO_SECRET_KEY: test-secret-key-do-not-use-in-prod
          DJANGO_DEBUG: "0"
          DB_NAME: itzuun
          DB_USER: itzuun_user
          DB_PASSWORD: itzuun_pass
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_SSLMODE: disable
          REDIS_URL: redis://localhost:6379/1
        run: |
          cd backend
          python manage.py check --fail-level WARNING

      - name: Migration Drift Check
        env:
          DJANGO_SECRET_KEY: test-secret-key-do-not-use-in-prod
          DJANGO_DEBUG: "0"
          DB_NAME: itzuun
          DB_USER: itzuun_user
          DB_PASSWORD: itzuun_pass
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_SSLMODE: disable
          REDIS_URL: redis://localhost:6379/1
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run

      - name: Run Backend Tests
        env:
          DJANGO_SECRET_KEY: test-secret-key-do-not-use-in-prod
          DJANGO_DEBUG: "0"
          DB_NAME: itzuun
          DB_USER: itzuun_user
          DB_PASSWORD: itzuun_pass
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_SSLMODE: disable
          REDIS_URL: redis://localhost:6379/1
        run: |
          cd backend
          python manage.py test

  frontend-quality-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint (ESLint)
        run: |
          cd frontend
          npm run lint || echo "ESLint found issues"

      - name: Type Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test

      - name: Build Next.js
        run: |
          cd frontend
          npm run build

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ backend-quality-checks, frontend-quality-checks ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Sync release files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          source: "backend/**,frontend/**,nginx/**,docker-compose.prod.yml"
          target: /root/itzuun
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            set -e
            cd /root/itzuun

            echo "=== Release files synced from CI runner ==="

            echo "=== Building and restarting api + web ==="
            docker compose -f docker-compose.prod.yml up -d --build --no-deps api web

            echo "=== Waiting for services ==="
            sleep 25

            echo "=== Health check ==="
            docker ps --filter "name=itzuun-api-1" --format "{{.Status}}" | grep -q "Up" && echo "API is UP" || (echo "API is DOWN" && exit 1)
            curl -sf -o /dev/null -w "%{http_code}" https://itzuun.works/ | grep -qE "^(200|307)" && echo "Site is UP" || (echo "Site check failed" && exit 1)

            echo "=== Deploy complete ==="
