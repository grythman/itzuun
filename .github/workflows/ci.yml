name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Start local PostgreSQL and Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib redis-server

          sudo systemctl start postgresql
          sudo systemctl start redis-server

          sudo -u postgres psql -tc "SELECT 1 FROM pg_roles WHERE rolname='itzuun_user'" | grep -q 1 || \
            sudo -u postgres psql -c "CREATE USER itzuun_user WITH PASSWORD 'itzuun_pass';"

          sudo -u postgres psql -c "ALTER ROLE itzuun_user CREATEDB;"

          sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname='itzuun'" | grep -q 1 || \
            sudo -u postgres psql -c "CREATE DATABASE itzuun OWNER itzuun_user;"

          sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE itzuun TO itzuun_user;"

          pg_isready -h localhost -p 5432
          redis-cli ping

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 isort pytest pytest-django psycopg[binary]

      - name: Formatting check (Black)
        run: |
          cd backend
          black --check . || echo "Black found issues"

      - name: Django System Checks
        env:
          DJANGO_SECRET_KEY: test-secret-key-do-not-use-in-prod
          DJANGO_DEBUG: "0"
          DB_NAME: itzuun
          DB_USER: itzuun_user
          DB_PASSWORD: itzuun_pass
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_SSLMODE: disable
          REDIS_URL: redis://localhost:6379/1
        run: |
          cd backend
          python manage.py check --fail-level WARNING

      - name: Migration Drift Check
        env:
          DJANGO_SECRET_KEY: test-secret-key-do-not-use-in-prod
          DJANGO_DEBUG: "0"
          DB_NAME: itzuun
          DB_USER: itzuun_user
          DB_PASSWORD: itzuun_pass
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_SSLMODE: disable
          REDIS_URL: redis://localhost:6379/1
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run

      - name: KPI report smoke check
        env:
          DJANGO_SECRET_KEY: test-secret-key-do-not-use-in-prod
          DJANGO_DEBUG: "0"
          DB_NAME: itzuun
          DB_USER: itzuun_user
          DB_PASSWORD: itzuun_pass
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_SSLMODE: disable
          REDIS_URL: redis://localhost:6379/1
        run: |
          cd backend
          python manage.py migrate --noinput
          python manage.py weekly_kpi_report --days 7 --json
          python manage.py pilot_readiness_report --json --cohort-validation /tmp/ci_missing_cohort_validation.json

      - name: Run Backend Tests
        env:
          DJANGO_SECRET_KEY: test-secret-key-do-not-use-in-prod
          DJANGO_DEBUG: "0"
          DB_NAME: itzuun
          DB_USER: itzuun_user
          DB_PASSWORD: itzuun_pass
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_SSLMODE: disable
          REDIS_URL: redis://localhost:6379/1
        run: |
          cd backend
          python manage.py test

  frontend-quality-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint (ESLint)
        run: |
          cd frontend
          npm run lint || echo "ESLint found issues"

      - name: Type Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test

      - name: Build Next.js
        run: |
          cd frontend
          npm run build

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ backend-quality-checks, frontend-quality-checks ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Sync release files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          source: "backend/**,frontend/**,nginx/**,docker-compose.prod.yml"
          target: /root/itzuun
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            set -e
            cd /root/itzuun

            echo "=== Release files synced from CI runner ==="

            echo "=== Building and restarting api + web ==="
            docker compose -f docker-compose.prod.yml up -d --build --no-deps api web

            echo "=== Health check (retry) ==="
            ok=0
            for i in $(seq 1 18); do
              a=$(docker ps --filter "name=itzuun-api-1" --format "{{.Status}}" || true)
              w=$(docker ps --filter "name=itzuun-web-1" --format "{{.Status}}" || true)
              c=$(curl -sS -L -o /dev/null -w "%{http_code}" https://itzuun.works/ || true)
              echo "try=$i api=[$a] web=[$w] code=$c"
              if echo "$a" | grep -q "Up" && echo "$w" | grep -q "Up" && echo "$c" | grep -qE "^(200|301|302|307|308)$"; then
                ok=1
                break
              fi
              sleep 10
            done

            if [ "$ok" -ne 1 ]; then
              echo "API/WEB health check failed"
              docker logs --tail 120 itzuun-api-1 || true
              docker logs --tail 120 itzuun-web-1 || true
              exit 1
            fi

            echo "=== Deploy complete ==="
