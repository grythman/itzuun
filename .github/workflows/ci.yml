name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-quality-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: itzuun_user
          POSTGRES_PASSWORD: itzuun_pass
          POSTGRES_DB: itzuun
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 isort pytest pytest-django psycopg[binary]

      - name: Formatting check (Black)
        run: |
          cd backend
          black --check . || echo "Black found issues"

      - name: Django System Checks
        env:
          DJANGO_SECRET_KEY: test-secret-key-do-not-use-in-prod
          DATABASE_URL: postgres://itzuun_user:itzuun_pass@localhost:5432/itzuun
          REDIS_URL: redis://localhost:6379/1
        run: |
          cd backend
          python manage.py check --fail-level WARNING

      - name: Migration Drift Check
        env:
          DJANGO_SECRET_KEY: test-secret-key-do-not-use-in-prod
          DATABASE_URL: postgres://itzuun_user:itzuun_pass@localhost:5432/itzuun
          REDIS_URL: redis://localhost:6379/1
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run

      - name: Run Backend Tests
        env:
          DJANGO_SECRET_KEY: test-secret-key-do-not-use-in-prod
          DATABASE_URL: postgres://itzuun_user:itzuun_pass@localhost:5432/itzuun
          REDIS_URL: redis://localhost:6379/1
        run: |
          cd backend
          python manage.py test

  frontend-quality-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint (ESLint)
        run: |
          cd frontend
          npm run lint || echo "ESLint found issues"

      - name: Type Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test

      - name: Build Next.js
        run: |
          cd frontend
          npm run build
