name: ITZuun CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: itzuun-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Lint GitHub workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          set -e
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            | bash -s -- latest

      - name: Run actionlint
        run: ./actionlint -color

  backend-quality-checks:
    name: Backend quality checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: itzuun
          POSTGRES_USER: itzuun_user
          POSTGRES_PASSWORD: itzuun_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itzuun_user -d itzuun"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: test-secret-key-do-not-use-in-prod
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DB_NAME: itzuun
      DB_USER: itzuun_user
      DB_PASSWORD: itzuun_pass
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_SSLMODE: disable
      REDIS_URL: redis://localhost:6379/1
      GOOGLE_CLIENT_ID: test-google-client-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      SENTRY_DSN: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 isort pytest pytest-django psycopg[binary]

      - name: Formatting check (Black)
        run: |
          cd backend
          black --check .

      - name: Import sorting check (isort)
        run: |
          cd backend
          isort --check-only .

      - name: Lint backend (flake8)
        run: |
          cd backend
          flake8 .

      - name: Django system checks
        run: |
          cd backend
          python manage.py check --fail-level WARNING

      - name: Migration drift check
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: |
          cd backend
          python manage.py migrate --noinput

      - name: Run backend tests
        run: |
          cd backend
          python manage.py test

  frontend-quality-checks:
    name: Frontend quality checks
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_BASE_URL: https://api.itzuun.works/api/v1
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: test-google-client-id.apps.googleusercontent.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Type check frontend
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run frontend tests
        run: |
          cd frontend
          npm test -- --watch=false

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  production-ready:
    name: Production ready
    runs-on: ubuntu-latest
    needs: [workflow-lint, backend-quality-checks, frontend-quality-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Mark production ready
        run: |
          echo "CI passed. Vercel and Render should deploy from Git integration / auto deploy."
          echo "No SSH/VPS deploy is used in this workflow."
