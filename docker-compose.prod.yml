version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itzuun}
      POSTGRES_USER: ${POSTGRES_USER:-itzuun_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itzuun_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itzuun_user} -d ${POSTGRES_DB:-itzuun}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-itzuun_redis_pass}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - django_static:/app/staticfiles
      - media_data:/app/media
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --worker-class gthread --threads 3 --timeout 60 --access-logfile - --error-logfile -"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - api
    environment:
      - NODE_ENV=production
      # In production, Next.js can send its SSR API fetches directly to the internal network
      - BACKEND_ORIGIN=http://api:8000
    expose:
      - "3000"

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - django_static:/var/www/django-static:ro
      - media_data:/var/www/media:ro
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  redis_data:
  django_static:
  media_data:
