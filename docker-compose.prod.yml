version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itzuun}
      POSTGRES_USER: ${POSTGRES_USER:-itzuun_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itzuun_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itzuun_user} -d ${POSTGRES_DB:-itzuun}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-itzuun_redis_pass}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DJANGO_DEBUG=0
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-this-in-production-immediately}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - DATABASE_URL=postgres://${POSTGRES_USER:-itzuun_user}:${POSTGRES_PASSWORD:-itzuun_pass}@db:5432/${POSTGRES_DB:-itzuun}
      - DB_NAME=${POSTGRES_DB:-itzuun}
      - DB_USER=${POSTGRES_USER:-itzuun_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-itzuun_pass}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://default:${REDIS_PASSWORD:-itzuun_redis_pass}@redis:6379/1
      - DJANGO_ALLOWED_HOSTS=itzuun.works,www.itzuun.works,localhost,127.0.0.1,api,web
      - DJANGO_CSRF_TRUSTED_ORIGINS=https://itzuun.works,https://www.itzuun.works,http://localhost,http://127.0.0.1
      - STATIC_ROOT=/app/staticfiles
      - MEDIA_ROOT=/app/media
    expose:
      - "8000"
    volumes:
      - django_static:/app/staticfiles
      - media_data:/app/media
 
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    restart: always
    depends_on:
      - api
    environment:
      - NODE_ENV=production
      # In production, Next.js can send its SSR API fetches directly to the internal network
      - BACKEND_ORIGIN=http://api:8000
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    expose:
      - "3000"

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - django_static:/var/www/django-static:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - media_data:/var/www/media:ro
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  redis_data:
  django_static:
  media_data:
