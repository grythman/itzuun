version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itzuun}
      POSTGRES_USER: ${POSTGRES_USER:-itzuun_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itzuun_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itzuun_user} -d ${POSTGRES_DB:-itzuun}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-itzuun_redis_pass}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DJANGO_DEBUG=0
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-this-in-production-immediately}
      - DATABASE_URL=postgres://${POSTGRES_USER:-itzuun_user}:${POSTGRES_PASSWORD:-itzuun_pass}@db:5432/${POSTGRES_DB:-itzuun}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-itzuun_redis_pass}@redis:6379/1
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api,web}
      - DJANGO_CSRF_TRUSTED_ORIGINS=${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
    # Optional: Serve from gunicorn on 8000
    expose:
      - "8000"
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --worker-class gthread --threads 3 --timeout 60 --access-logfile - --error-logfile -"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - api
    environment:
      - NODE_ENV=production
      - BACKEND_ORIGIN=http://api:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
