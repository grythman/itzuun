upstream django_upstream {
    server api:8000;
    keepalive 64;
}

upstream nextjs_upstream {
    server web:3000;
    keepalive 64;
}

# 1. HTTP-ээс HTTPS рүү чиглүүлэх
server {
    listen 80;
    server_name itzuun.works www.itzuun.works;
    return 301 https://$host$request_uri;
}

# 2. HTTPS тохиргоо
server {
    listen 443 ssl;
    server_name itzuun.works www.itzuun.works;

    # SSL сертификатын замууд (Certbot-оос авсан замаар солино уу)
    ssl_certificate /etc/letsencrypt/live/itzuun.works/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itzuun.works/privkey.pem;

    client_max_body_size 20m;

    # API, Admin
    location ~ ^/(api/v1|admin|swagger|redoc) {
        proxy_pass http://django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 👇 ЗАСВАР ЭНД ОРСОН: /django-static/ гэснийг /static/ болгож засав
    location /static/ {
        alias /var/www/django-static/;
    }

    location /media/ {
        alias /var/www/media/;
    }

    # Frontend (Next.js)
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
