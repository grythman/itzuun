upstream django_upstream {
    server api:8000;
    keepalive 64;
}

upstream nextjs_upstream {
    server web:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name itzuun.works www.itzuun.works; 
    
    # Allow larger payloads for file uploads (e.g., attachments, profile pictures)
    client_max_body_size 20m;

    # Gzip Compression for text assets bandwidth reduction
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. Route API, Admin, and OpenAPI documentation to Django
    location ~ ^/(api/v1|admin|swagger|redoc) {
        proxy_pass http://django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Align timeouts with Gunicorn
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    # 2. Route WebSockets to Django (E.g., if needed for realtime dispute chats)
    location /ws/ {
        proxy_pass http://django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    # 3. Serve Django static and media files natively via Nginx (Needs shared Docker volumes in prod)
    location /django-static/ {
        alias /var/www/django-static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /var/www/media/;
        expires 30d;
        access_log off;
    }

    # 4. Route all other requests to the Next.js Frontend
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
